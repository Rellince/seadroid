name: Build APK

on:
  push:
    branches: [rellince]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write   # for creating GitHub Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Compute version metadata
        id: meta
        run: |
          SHA_SHORT=${GITHUB_SHA::12}
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            APK_TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION="rellince-${{ github.run_number }}-${SHA_SHORT}"
            APK_TAG="${VERSION}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "apk_tag=${APK_TAG}" >> $GITHUB_OUTPUT

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.SEADROID_KEYSTORE_B64 }}
        run: |
          if [[ -z "${KEYSTORE_B64}" ]]; then
            echo "::error::SEADROID_KEYSTORE_B64 secret not set"
            exit 1
          fi
          echo "${KEYSTORE_B64}" | base64 -d > app/release.keystore
          chmod 600 app/release.keystore

      - name: Write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.SEADROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS:      ${{ secrets.SEADROID_KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.SEADROID_KEY_PASSWORD }}
        run: |
          cat > app/key.properties <<EOF
          keyStore=release.keystore
          keyStorePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyAliasPassword=${KEY_PASSWORD}
          EOF
          chmod 600 app/key.properties

      - name: Assemble release APK
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [[ -z "${APK_PATH}" ]]; then
            echo "::error::No release APK produced"
            exit 1
          fi
          # Stable name for the release asset
          RENAMED="seadroid-rellince-${{ steps.meta.outputs.version }}.apk"
          cp "${APK_PATH}" "${RENAMED}"
          echo "apk_path=${RENAMED}" >> $GITHUB_OUTPUT

      - name: Upload artifact (always — handy for branch builds)
        uses: actions/upload-artifact@v4
        with:
          name: seadroid-${{ steps.meta.outputs.version }}
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.apk_tag }}
          name: Seadroid (rellince) ${{ steps.meta.outputs.version }}
          files: ${{ steps.apk.outputs.apk_path }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wipe keystore + key.properties
        if: always()
        run: |
          rm -f app/release.keystore app/key.properties
